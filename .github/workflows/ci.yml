name: Xvond Core CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: xvond-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xvond
          POSTGRES_PASSWORD: xvond_test_password
          POSTGRES_DB: xvond_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xvond -d xvond_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://xvond:xvond_test_password@localhost:5432/xvond_test
      DATABASE_URL_DOCKER: postgresql+psycopg://xvond:xvond_test_password@postgres:5432/xvond_test
      POSTGRES_PASSWORD: xvond_test_password
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_ISSUER: xvond-core
      JWT_AUDIENCE: xvond-users

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify installed dependencies
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q backend scripts tests
      - name: Build fresh database from migrations
        run: alembic upgrade head
      - name: Check frontend JavaScript syntax
        run: |
          for file in frontend/admin/*.js frontend/customer/*.js; do
            node --check "$file"
          done
      - name: Check shell script syntax
        run: |
          for file in scripts/*.sh; do
            sh -n "$file"
          done
      - name: Validate production Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.production.yml config --quiet
      - name: Run tests
        run: pytest -q
      - name: Build production container
        run: docker build --tag xvond-core:ci .
