services:
  postgres:
    image: postgres:17
    container_name: xvond-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xvond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-xvond}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - xvond_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-xvond} -d ${POSTGRES_DB:-xvond}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  xvond_postgres_data:
