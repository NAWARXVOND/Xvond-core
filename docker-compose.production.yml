services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xvond-core:latest
    container_name: xvond-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  whatsapp-worker:
    image: xvond-core:latest
    container_name: xvond-whatsapp-worker
    restart: unless-stopped
    entrypoint: []
    command: ["python", "-m", "scripts.whatsapp_worker"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: xvond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xvond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-xvond}
    volumes:
      - xvond_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-xvond} -d ${POSTGRES_DB:-xvond}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:17
    container_name: xvond-postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-xvond}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-xvond}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - xvond_backups:/backups
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/backup_loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  offsite-backup:
    image: restic/restic:0.19.1
    container_name: xvond-offsite-backup
    hostname: xvond-offsite-backup
    restart: unless-stopped
    profiles: ["offsite-backup"]
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      OFFSITE_BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_KEEP_DAILY: ${OFFSITE_KEEP_DAILY:-14}
      OFFSITE_KEEP_WEEKLY: ${OFFSITE_KEEP_WEEKLY:-8}
      OFFSITE_KEEP_MONTHLY: ${OFFSITE_KEEP_MONTHLY:-12}
    volumes:
      - xvond_backups:/backups:ro
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/offsite_backup_loop.sh"]
    depends_on:
      postgres-backup:
        condition: service_started

  offsite-restore-verify:
    image: restic/restic:0.19.1
    hostname: xvond-offsite-restore-verify
    profiles: ["offsite-verify"]
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      RESTORE_DIR: /restore
    volumes:
      - xvond_restore_verify:/restore
      - ./scripts:/opt/xvond/scripts:ro
    entrypoint: ["/bin/sh", "/opt/xvond/scripts/offsite_restore_latest.sh"]

  redis:
    image: redis:7.4-alpine
    container_name: xvond-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - xvond_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  xvond_postgres_data:
  xvond_redis_data:
  xvond_backups:
  xvond_restore_verify:
